name: Check Mercado Publico Ticket Presence

on:
  push:
    branches: [analysis/radar-vertical-decision]
    paths: ['.github/workflows/check-mercadopublico-ticket.yml']

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event.head_commit.message == 'analysis: check Mercado Publico ticket presence'
    runs-on: ubuntu-latest
    env:
      MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          if [ -n "$MERCADOPUBLICO_TICKET" ]; then
            echo 'MERCADOPUBLICO_TICKET_PRESENT=true'
          else
            echo 'MERCADOPUBLICO_TICKET_PRESENT=false'
          fi
          echo 'Secret value was not printed.'
