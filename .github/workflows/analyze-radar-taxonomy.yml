name: Analyze Radar Taxonomy

on:
  workflow_dispatch:
  push:
    branches: [feat/radar-taxonomy-v2]
    paths:
      - '.github/workflows/analyze-radar-taxonomy.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official July 2026 Compra Agil archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/compra-agil.zip \
            'https://transparenciachc.blob.core.windows.net/trnspchc/COT_2026-07.zip'
          unzip -t /tmp/compra-agil.zip >/dev/null

      - name: Prepare same 15000-process cohort with taxonomy v2
        shell: bash
        run: |
          set -euo pipefail
          python radar/phase0/etl/prepare_open_data.py /tmp/compra-agil.zip \
            --period 2026-07 \
            --max-processes 15000 \
            --out /tmp/v2.json

      - name: Measure coverage and remaining uncategorized demand
        shell: bash
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from collections import Counter
          x=json.load(open('/tmp/v2.json', encoding='utf-8'))
          metrics=x['metrics']; total=x['summary']['processes']
          otros_rows=[p for p in x['processes'] if p['category']=='OTROS']
          share=len(otros_rows)/total
          baseline=10611/15000
          print(f'Processes: {total}')
          print(f'Categories: {len(metrics)}')
          print(f'OTROS v1 share: {baseline:.2%}')
          print(f'OTROS v2 share: {share:.2%}')
          print(f'Coverage improvement: {(baseline-share):.2%} points')
          print('\nRANKING V2')
          for m in metrics:
            print(f"{m['category']}: score={m['opportunity_market_score']}, processes={m['process_count']}, competitors={m['median_competitors']}, low_comp={m['low_competition_share']}, confidence={m['score_confidence']}")

          stop={'adquisicion','adquisici','compra','cotizacion','servicio','servicios','para','del','de','la','el','los','las','y','en','por','con','un','una','se','que','su','sus','al','2026','2025','municipalidad','solicitud','contratacion','suministro','provision','requerimiento','segun','mediante','correspondiente','unidad','programa','julio','agosto','adq','requiere','regional','direccion','municipal','centro','departamento','comuna','proyecto','uso','varios','generales','tipo','actividad','actividades'}
          def toks(s):
            s=''.join(c for c in unicodedata.normalize('NFD', s or '') if unicodedata.category(c)!='Mn').lower()
            return [t for t in re.findall(r'[a-z0-9]{3,}', s) if t not in stop and not t.isdigit()]
          words=Counter(); bigrams=Counter()
          for p in otros_rows:
            ts=toks(p.get('title'))
            words.update(set(ts))
            bigrams.update(set(' '.join(ts[i:i+2]) for i in range(len(ts)-1)))
          print('\nV2 OTROS TOP WORDS')
          for k,v in words.most_common(100): print(f'{v:5d}  {k}')
          print('\nV2 OTROS TOP BIGRAMS')
          for k,v in bigrams.most_common(100): print(f'{v:5d}  {k}')
          if total != 15000 or share >= baseline:
            raise SystemExit('Taxonomy validation failed')
          PY

      - name: Confirm no writes
        run: echo 'Public archive analysis only; no Cloudflare or D1 write was executed.'
