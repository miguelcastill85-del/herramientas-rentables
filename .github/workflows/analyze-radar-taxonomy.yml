name: Analyze Radar Taxonomy

on:
  workflow_dispatch:
  push:
    branches: [feat/radar-taxonomy-v2]
    paths:
      - '.github/workflows/analyze-radar-taxonomy.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify credentials and resolve exact D1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_API_TOKEN" == cfat_* ]]
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=radar-rentable-estado&per_page=10" >/tmp/d1.json
          DB_ID="$(node -e 'const x=require("/tmp/d1.json");const m=(x.result||[]).filter(v=>v.name==="radar-rentable-estado");if(!x.success||m.length!==1)process.exit(1);process.stdout.write(m[0].uuid)')"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"
          echo 'Exact D1 resolved; analysis is read-only.'

      - name: Read uncategorized process titles
        shell: bash
        run: |
          set -euo pipefail
          node -e 'require("fs").writeFileSync("/tmp/query.json",JSON.stringify({sql:"SELECT title FROM compra_agil_raw WHERE category = '\''OTROS'\'' AND title IS NOT NULL LIMIT 15000;"}))'
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/query" >/tmp/titles.json
          node -e 'const x=require("/tmp/titles.json");if(!x.success)process.exit(1);console.log(`Rows read: ${(x.result?.[0]?.results||[]).length}`)'

      - name: Rank demand terms and phrases
        shell: bash
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from collections import Counter

          x=json.load(open('/tmp/titles.json', encoding='utf-8'))
          rows=(x.get('result') or [{}])[0].get('results') or []
          stop={
            'adquisicion','adquisición','compra','cotizacion','cotización','servicio','servicios','para','del','de','la','el','los','las','y','en','por','con','un','una','se','a','e','o','que','su','sus','al','n','s','2026','2025','municipalidad','solicitud','contratacion','contratación','suministro','provision','provisión','requerimiento','requerimientos','segun','según','mediante','correspondiente','unidad'
          }
          def norm(s):
            s=''.join(c for c in unicodedata.normalize('NFD', s or '') if unicodedata.category(c)!='Mn').lower()
            return re.findall(r'[a-z0-9]{3,}', s)
          words=Counter(); bigrams=Counter(); trigrams=Counter()
          for row in rows:
            toks=[t for t in norm(row.get('title')) if t not in stop and not t.isdigit()]
            words.update(set(toks))
            bigrams.update(set(' '.join(toks[i:i+2]) for i in range(len(toks)-1)))
            trigrams.update(set(' '.join(toks[i:i+3]) for i in range(len(toks)-2)))
          print('TOP WORDS (document frequency)')
          for k,v in words.most_common(100): print(f'{v:5d}  {k}')
          print('\nTOP BIGRAMS')
          for k,v in bigrams.most_common(100): print(f'{v:5d}  {k}')
          print('\nTOP TRIGRAMS')
          for k,v in trigrams.most_common(60): print(f'{v:5d}  {k}')
          PY

      - name: Confirm no writes
        run: echo 'Read-only taxonomy analysis completed; no D1 mutation or Cloudflare resource operation was executed.'
