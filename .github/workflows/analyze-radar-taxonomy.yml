name: Analyze Radar Taxonomy

on:
  workflow_dispatch:
  push:
    branches: [feat/radar-taxonomy-v2]
    paths:
      - '.github/workflows/analyze-radar-taxonomy.yml'
      - 'radar/phase0/etl/taxonomy.py'
      - 'radar/phase0/etl/prepare_open_data.py'

concurrency:
  group: analyze-radar-taxonomy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official July 2026 Compra Agil archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/compra-agil.zip \
            'https://transparenciachc.blob.core.windows.net/trnspchc/COT_2026-07.zip'
          unzip -t /tmp/compra-agil.zip >/dev/null

      - name: Prepare same 15000-process cohort with taxonomy v3
        shell: bash
        run: |
          set -euo pipefail
          python radar/phase0/etl/prepare_open_data.py /tmp/compra-agil.zip \
            --period 2026-07 \
            --max-processes 15000 \
            --out /tmp/v3.json

      - name: Measure connector-insensitive coverage and ranking
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/v3.json', encoding='utf-8'))
          metrics=x['metrics']; total=x['summary']['processes']
          otros=next((m['process_count'] for m in metrics if m['category']=='OTROS'), 0)
          share=otros/total if total else 1
          v1=10611/15000
          v2=4729/15000
          print(f'Processes: {total}')
          print(f'Categories: {len(metrics)}')
          print(f'OTROS v1 share: {v1:.2%}')
          print(f'OTROS v2 share: {v2:.2%}')
          print(f'OTROS v3 share: {share:.2%}')
          print(f'V3 improvement over v2: {(v2-share):.2%} points')
          print('\nRANKING V3')
          for m in metrics:
            print(f"{m['category']}: score={m['opportunity_market_score']}, processes={m['process_count']}, median_budget={m['median_budget_clp']}, competitors={m['median_competitors']}, low_comp={m['low_competition_share']}, repeat={m['repeated_buyer_share']}, coverage={m['price_observability']}, confidence={m['score_confidence']}")
          if total != 15000:
            raise SystemExit('Unexpected cohort size')
          if share >= v2:
            raise SystemExit('Taxonomy v3 did not improve over v2')
          PY

      - name: Confirm no writes
        run: echo 'Public archive analysis only; no Cloudflare credential or D1 write was used.'
