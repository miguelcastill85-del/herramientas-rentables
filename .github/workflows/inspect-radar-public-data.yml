name: Inspect Radar Public Data

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Periodo AAAA-MM de Compra Ágil'
        required: true
        default: '2026-07'
  push:
    branches: [feat/radar-public-data-ingestion]
    paths:
      - '.github/workflows/inspect-radar-public-data.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      PERIOD: ${{ github.event.inputs.period || '2026-07' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download official public Compra Agil archive
        shell: bash
        run: |
          set -euo pipefail
          URL="https://transparenciachc.blob.core.windows.net/trnspchc/COT_${PERIOD}.zip"
          echo "Source: ChileCompra public open-data archive for ${PERIOD}"
          curl --fail --location --retry 3 --output /tmp/compra-agil.zip "$URL"
          ls -lh /tmp/compra-agil.zip
          unzip -t /tmp/compra-agil.zip >/dev/null
      - name: Inspect archive structure and CSV header
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 /tmp/compra-agil.zip | sed -n '1,20p'
          CSV="$(unzip -Z1 /tmp/compra-agil.zip | grep -Ei '\.csv$' | head -n 1)"
          test -n "$CSV" || { echo 'No CSV found in archive'; exit 1; }
          echo "Selected CSV: $CSV"
          echo 'Header:'
          unzip -p /tmp/compra-agil.zip "$CSV" | head -n 1
          ROWS="$(unzip -p /tmp/compra-agil.zip "$CSV" | awk 'END {print NR-1}')"
          echo "CSV data rows: $ROWS"
      - name: Safe sample normalization
        shell: bash
        run: |
          set -euo pipefail
          CSV="$(unzip -Z1 /tmp/compra-agil.zip | grep -Ei '\.csv$' | head -n 1)"
          unzip -p /tmp/compra-agil.zip "$CSV" | head -n 5001 > /tmp/sample.csv
          python radar/phase0/etl/normalize.py /tmp/sample.csv --out /tmp/sample-output.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/sample-output.json', encoding='utf-8'))
          print(json.dumps({'summary': x['summary'], 'top_categories': x['category_metrics'][:5]}, ensure_ascii=False, indent=2))
          if x['summary']['processes'] == 0:
              raise SystemExit('Normalizer did not recognize any process rows')
          PY
