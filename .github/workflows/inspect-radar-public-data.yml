name: Inspect Radar Public Data

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Periodo AAAA-MM de Compra Ágil'
        required: true
        default: '2026-07'
  push:
    branches: [feat/radar-public-data-ingestion]
    paths:
      - '.github/workflows/inspect-radar-public-data.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      PERIOD: ${{ github.event.inputs.period || '2026-07' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download official public Compra Agil archive
        shell: bash
        run: |
          set -euo pipefail
          URL="https://transparenciachc.blob.core.windows.net/trnspchc/COT_${PERIOD}.zip"
          echo "Source: ChileCompra public open-data archive for ${PERIOD}"
          curl --fail --location --retry 3 --output /tmp/compra-agil.zip "$URL"
          unzip -t /tmp/compra-agil.zip >/dev/null
          ls -lh /tmp/compra-agil.zip
      - name: Prepare 15000 real processes without remote writes
        shell: bash
        run: |
          set -euo pipefail
          python radar/phase0/etl/open_data_ingest.py prepare /tmp/compra-agil.zip \
            --period "$PERIOD" \
            --max-processes 15000 \
            --out /tmp/prepared.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/prepared.json', encoding='utf-8'))
          assert x['summary']['processes'] == 15000, x['summary']
          assert x['summary']['categories'] > 0, x['summary']
          print('Prepared dataset validated; no Cloudflare writes were performed.')
          PY
