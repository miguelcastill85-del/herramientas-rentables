name: Analyze Radar Full July 2026

on:
  workflow_dispatch:
  push:
    branches: [analysis/radar-vertical-decision]
    paths: ['.github/workflows/analyze-radar-full-july.yml']

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'analysis: validate verticals on full July open data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official July 2026 Compra Agil data
        run: |
          curl --fail --location --retry 3 --output /tmp/cot.zip 'https://transparenciachc.blob.core.windows.net/trnspchc/COT_2026-07.zip'
          unzip -t /tmp/cot.zip >/dev/null
      - name: Analyze every July process without Cloudflare
        shell: bash
        run: |
          PYTHONPATH=radar/phase0/etl python - <<'PY'
          import csv, io, re, statistics, unicodedata, zipfile
          from collections import Counter, defaultdict
          from taxonomy import classify
          from normalize import money, yes
          from open_data_ingest import build_metrics

          def first(r,*ks):
              for k in ks:
                  v=r.get(k)
                  if v is not None and str(v).strip(): return str(v).strip()
          def norm(s):
              s=''.join(c for c in unicodedata.normalize('NFD',s or '') if unicodedata.category(c)!='Mn').lower()
              return ' '.join(re.findall(r'[a-z0-9]+',s))

          data={}; rows_scanned=0
          with zipfile.ZipFile('/tmp/cot.zip') as z:
              for name in sorted(n for n in z.namelist() if n.lower().endswith('.csv')):
                  with z.open(name) as f:
                      sample=f.read(131072)
                      try: sample.decode('utf-8-sig'); enc='utf-8-sig'
                      except UnicodeDecodeError: enc='cp1252'
                  print(f'{name}: {enc}')
                  with z.open(name) as f:
                      rd=csv.DictReader(io.TextIOWrapper(f,encoding=enc,errors='replace',newline=''),delimiter=';',quotechar='"')
                      for r in rd:
                          rows_scanned+=1
                          code=first(r,'CodigoCotizacion')
                          if not code: continue
                          if code not in data:
                              data[code]={
                                'codigo':code,'title':first(r,'NombreCotizacion') or '',
                                'buyer_id':first(r,'RUTUnidaddeCompra','RutUnidaddeCompra','CodigoUnidaddeCompra'),
                                'buyer_name':first(r,'RazonSocialUnidaddeCompra','NombreUnidaddeCompra','NombreOOPP') or '',
                                'region':first(r,'Region'),'budget_clp':money(first(r,'MontoTotalDisponble','MontoTotalDisponible')),
                                'suppliers':set(),'selected_amount_clp':None,'texts':[],'products':set()}
                          p=data[code]
                          s=first(r,'RUTProveedor','RutProveedor','RazonSocialProveedor')
                          if s: p['suppliers'].add(s)
                          if yes(first(r,'ProveedorSeleccionado')):
                              a=money(first(r,'MontoTotal'))
                              if a and a>0: p['selected_amount_clp']=a
                          vals=[first(r,k) for k in ('NombreCotizacion','DescripcionCotizacion','ProductoCotizado','NombreProductoGenerico','DetalleCotizacion')]
                          txt=' '.join(v for v in vals if v)
                          if txt and txt not in p['texts'] and len(p['texts'])<4: p['texts'].append(txt)
                          for k in ('ProductoCotizado','NombreProductoGenerico'):
                              v=first(r,k)
                              if v and len(p['products'])<20: p['products'].add(v)

          processes=[]
          for p in data.values():
              category=classify(' '.join(p['texts']))
              processes.append({
                'codigo':p['codigo'],'buyer_id':p['buyer_id'],'buyer_name':p['buyer_name'],'region':p['region'],
                'budget_clp':p['budget_clp'],'competitor_count':len(p['suppliers']),
                'selected_amount_clp':p['selected_amount_clp'],'category':category})
              p['category']=category

          metrics=build_metrics(processes)
          print(f'archive_rows={rows_scanned} distinct_processes={len(processes)} categories={len(metrics)}')
          print('\nFULL-JULY MARKET RANKING')
          for m in metrics:
              if m['category']=='OTROS': continue
              print(f"{m['category']}: score={m['opportunity_market_score']} processes={m['process_count']} median_budget={m['median_budget_clp']} median_comp={m['median_competitors']} low_comp={m['low_competition_share']:.2%} repeat={m['repeated_buyer_share']:.2%} coverage={m['price_observability']:.2%} confidence={m['score_confidence']}")

          risk=['reactiv','diagnost','pcr','test ',' test','examen','muestra humana','sangre','serolog','inmuno','hematolog','bioquim','coagul','antigen','anticuerpo','microbiolog','bacteriolog','cultivo','elisa','cobas','hba1c','virus','sars','cov2','glucosa','esteril','hipoderm','jering','aguja','cateter','transfusion','donacion','hemodial','kit diagnost','kit extraccion','analizador','autoclave','centrifug','microscop','desfibril','rayos x','mamograf','tomograf','ventilador mecanico','esterilizacion','esfigmoman','cpap','bpap','implante','stent']
          health=['hospital','servicio de salud','cesfam','salud municipal','subsecretaria de salud','seremi de salud','consultorio','clinica']
          themes={
            'VIDRIERIA':['vaso precipitado','matraz','probeta','vidrieria','frasco vidrio','botella vidrio','portaobjeto','cubreobjeto'],
            'PIPETEO':['pipeta','micropipeta','punta pipeta','puntas pipeta'],
            'FILTRACION':['papel filtro','papel filtrante','filtro laboratorio','membrana filtr'],
            'RECIPIENTES_PLASTICOS':['tubo plast','tubos plast','frasco plast','botella plast','recipiente plast','caja plast','cubeta'],
            'SOPORTES':['gradilla','rack laboratorio','soporte laboratorio'],
            'AGUA_LAB':['agua destilada','agua desionizada'],
            'MATERIAL_CIENCIA':['material de ciencia','materiales de ciencia','material didactico laboratorio','material laboratorio escolar'],
            'INSUMOS_GENERALES':['materiales generales laboratorio','insumos generales laboratorio','materiales varios laboratorio','insumos laboratorio'],
            'HIELO_SECO':['hielo seco']}
          lab=[]
          for p in data.values():
              if p['category']!='LABORATORIO': continue
              blob=norm(' '.join([p['title'],*p['texts'],*p['products']]))
              b=norm(p['buyer_name'])
              sector='SALUD' if any(x in b for x in health) else ('ACADEMIA_INVESTIGACION' if any(x in b for x in ['universidad','investigaciones agropecuarias','instituto de investigacion','instituto investigaciones']) else 'PUBLICO_NO_SALUD')
              lab.append((p,blob,sector,any(x in blob for x in risk)))
          safe=[x for x in lab if not x[3] and x[2]!='SALUD']
          print(f'\nFULL-JULY LAB: total={len(lab)} safe_non_health={len(safe)} safe_share={len(safe)/len(lab):.2%}')
          print('LAB sectors:',dict(Counter(x[2] for x in lab)))

          grouped=defaultdict(list)
          for p,blob,sector,risky in safe:
              hits=[n for n,ks in themes.items() if any(k in blob for k in ks)] or ['OTRO']
              for h in hits: grouped[h].append(p)
          print('\nFULL-JULY SAFE LAB THEMES')
          for h,items in sorted(grouped.items(),key=lambda x:len(x[1]),reverse=True):
              cs=[len(p['suppliers']) for p in items]; bs=[p['budget_clp'] for p in items if p['budget_clp']]
              buyers=Counter(p['buyer_name'] for p in items if p['buyer_name'])
              low=sum(1 for c in cs if 1<=c<=3)/len(cs) if cs else 0
              print(f'{h}: n={len(items)} med_budget={statistics.median(bs) if bs else 0:.0f} med_comp={statistics.median(cs) if cs else 0:.1f} low_comp={low:.2%} buyers={len(buyers)} repeat_buyers={sum(v>=2 for v in buyers.values())}')

          # Produce a simple regulation-adjusted comparison. LAB gets only its conservative
          # safe share as the accessible portion; other leading product verticals are left
          # unpenalized here and must still pass their own regulatory/sourcing review.
          by={m['category']:m for m in metrics}
          print('\nACCESSIBLE-DEMAND SENSITIVITY')
          for cat in ['LABORATORIO','ALIMENTOS','VEHICULOS','FERRETERIA','ASEO','OFICINA']:
              m=by.get(cat)
              if not m: continue
              accessible=m['process_count']*(len(safe)/len(lab) if cat=='LABORATORIO' and lab else 1)
              print(f'{cat}: market_score={m["opportunity_market_score"]} raw_processes={m["process_count"]} conservative_accessible_processes={accessible:.0f} median_comp={m["median_competitors"]} low_comp={m["low_competition_share"]:.2%}')
          PY
      - name: Confirm no Cloudflare access
        run: echo 'Full-month analysis used only public ChileCompra data; no Cloudflare credentials, D1 reads/writes, resource creation, or paid services.'
