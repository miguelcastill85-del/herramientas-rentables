name: Ops Deploy Live Fasteners

on:
  push:
    branches: [ops/deploy-live-fasteners]
    paths: ['.github/workflows/ops-deploy-live-fasteners.yml']

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.head_commit.message == 'ops: deploy live fastening radar safely'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
      WORKER_NAME: radar-rentable-estado
      DB_NAME: radar-rentable-estado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Enforce zero-cost guard
        shell: bash
        run: |
          echo 'Free-only guard: this run reuses the existing Worker and D1 only.'
          echo 'No database creation, schema writes, billing changes, upgrades, KV, R2, Queues, AI, or paid services are permitted.'
      - name: Validate secrets without printing them
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$MERCADOPUBLICO_TICKET" || { echo 'Missing MERCADOPUBLICO_TICKET'; exit 1; }
          echo 'Required secrets are present.'
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/^Bearer[[:space:]]+//I; s/^"(.*)"$/\1/')"
          test -n "$TOKEN" || { echo 'Normalized token is empty'; exit 1; }
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Token normalized; length=${#TOKEN}; value not printed."
      - name: Verify account token and resolve existing D1 read-only
        shell: bash
        run: |
          node - <<'NODE'
          const fs = await import('node:fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const dbName=process.env.DB_NAME;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function cf(path){
            const r=await fetch(`https://api.cloudflare.com/client/v4${path}`,{headers});
            const text=await r.text();
            let data; try{data=JSON.parse(text)}catch{throw new Error(`Cloudflare HTTP ${r.status}: non-JSON response`)}
            if(!r.ok || !data.success) throw new Error(`Cloudflare HTTP ${r.status}: ${JSON.stringify(data.errors||[]).slice(0,800)}`);
            return data;
          }
          const verify=await cf(`/accounts/${account}/tokens/verify`);
          if(verify.result?.status!=='active') throw new Error(`Cloudflare token status is ${verify.result?.status}`);
          console.log('Cloudflare account token: active');
          const list=await cf(`/accounts/${account}/d1/database?name=${encodeURIComponent(dbName)}&per_page=10`);
          const matches=(list.result||[]).filter(x=>x.name===dbName);
          if(matches.length!==1) throw new Error(`Expected exactly one existing D1 named ${dbName}; found ${matches.length}. No writes performed.`);
          const id=matches[0].uuid||matches[0].id;
          if(!id) throw new Error('Existing D1 has no id');
          fs.appendFileSync(process.env.GITHUB_ENV,`DB_ID=${id}\n`);
          console.log(`Existing D1 resolved exactly once: ${dbName}; reused=true; created=false`);
          NODE
      - name: Patch local config only
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='radar/phase0/wrangler.jsonc';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('REEMPLAZAR_DESPUES_DE_CREAR_D1',process.env.DB_ID))"
      - name: Dry-run bundle before any remote writes
        working-directory: radar/phase0
        shell: bash
        run: |
          rm -rf ../../dist-live
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID pnpm exec wrangler deploy --dry-run --outdir ../../dist-live
          mapfile -t bundles < <(find ../../dist-live -type f \( -name '*.js' -o -name '*.mjs' \))
          test "${#bundles[@]}" -eq 1 || { echo "Expected exactly one JS module bundle, found ${#bundles[@]}"; exit 1; }
          echo "BUNDLE_PATH=${bundles[0]}" >> "$GITHUB_ENV"
          echo 'Dry-run succeeded before remote writes.'
      - name: Upload existing Worker with existing D1 binding
        shell: bash
        run: |
          node - <<'NODE'
          const fs=await import('node:fs'); const path=await import('node:path');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID; const token=process.env.CF_TOKEN;
          const worker=process.env.WORKER_NAME; const dbId=process.env.DB_ID; const file=process.env.BUNDLE_PATH;
          const moduleName=path.basename(file);
          async function upload(bindingField){
            const metadata={main_module:moduleName,compatibility_date:'2026-08-25',bindings:[{type:'d1',name:'DB',[bindingField]:dbId}]};
            const form=new FormData();
            form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}),'metadata.json');
            form.append(moduleName,new Blob([fs.readFileSync(file)],{type:'application/javascript+module'}),moduleName);
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`},body:form});
            const text=await r.text(); let data; try{data=JSON.parse(text)}catch{data={success:false,errors:[{message:'non-JSON response'}]}};
            return {r,data};
          }
          let out=await upload('id');
          if(!out.r.ok || !out.data.success){
            const msg=JSON.stringify(out.data.errors||[]);
            if(/database_id/i.test(msg)) out=await upload('database_id');
          }
          if(!out.r.ok || !out.data.success) throw new Error(`Worker upload failed HTTP ${out.r.status}: ${JSON.stringify(out.data.errors||[]).slice(0,1000)}`);
          console.log(`Worker deployed: ${worker}; D1 binding reused; no new Worker resource name created.`);
          NODE
      - name: Store Mercado Publico ticket as Worker secret
        shell: bash
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID; const token=process.env.CF_TOKEN; const worker=process.env.WORKER_NAME;
          const body={name:'MERCADOPUBLICO_TICKET',text:process.env.MERCADOPUBLICO_TICKET,type:'secret_text'};
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
          const data=await r.json();
          if(!r.ok || !data.success) throw new Error(`Worker secret write failed HTTP ${r.status}: ${JSON.stringify(data.errors||[]).slice(0,800)}`);
          console.log('Mercado Publico ticket stored as Worker secret; value not printed.');
          NODE
      - name: Resolve workers.dev URL and verify live endpoint
        shell: bash
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID; const token=process.env.CF_TOKEN; const worker=process.env.WORKER_NAME;
          const headers={Authorization:`Bearer ${token}`};
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/subdomain`,{headers});
          const data=await r.json();
          if(!r.ok || !data.success || !data.result?.subdomain) throw new Error(`Could not resolve workers.dev subdomain: ${JSON.stringify(data.errors||[]).slice(0,800)}`);
          const base=`https://${worker}.${data.result.subdomain}.workers.dev`;
          console.log(`Worker URL: ${base}`);
          async function check(path){
            let last;
            for(let i=0;i<5;i++){
              const res=await fetch(base+path,{headers:{Accept:'application/json'}});
              const text=await res.text(); last={status:res.status,text};
              if(res.ok) return last;
              await new Promise(x=>setTimeout(x,3000));
            }
            throw new Error(`${path} failed after retries: HTTP ${last.status} ${last.text.slice(0,500)}`);
          }
          const health=await check('/health');
          const h=JSON.parse(health.text); if(!h.ok) throw new Error('/health payload is not ok');
          console.log('/health: OK');
          const live=await check('/api/opportunities/live');
          const payload=JSON.parse(live.text);
          if(!Array.isArray(payload.items)) throw new Error('live endpoint did not return items array');
          console.log(`/api/opportunities/live: OK; total=${payload.total ?? payload.items.length}`);
          for(const item of payload.items.slice(0,10)){
            console.log('LIVE '+JSON.stringify({codigo:item.codigo,nombre:item.nombre,monto_disponible_clp:item.monto_disponible_clp,ofertas_recibidas:item.ofertas_recibidas,organismo:item.organismo,region:item.region,fecha_cierre:item.fecha_cierre,score:item.score}));
          }
          NODE
      - name: Summary
        run: |
          echo 'Deployment complete: dry-run before writes; existing D1 reused; existing Worker updated; Mercado Publico ticket stored; live endpoint verified; free-only.'
