name: Ops Refresh Mercado Publico Ticket

on:
  push:
    branches: [ops/deploy-live-fasteners]
    paths: ['.github/workflows/ops-refresh-mercadopublico-ticket.yml']

permissions:
  contents: read

jobs:
  refresh-and-test:
    if: >-
      github.event.head_commit.message == 'ops: refresh Mercado Publico ticket and test live radar'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
      WORKER_NAME: radar-rentable-estado
      WORKER_URL: https://radar-rentable-estado.miguelcastill85.workers.dev
    steps:
      - name: Zero-cost and scope guard
        shell: bash
        run: |
          echo 'This run only replaces one secret on the existing Worker and performs read-only HTTP checks.'
          echo 'No D1 writes, Worker code deployment, resource creation, billing changes, or paid services are permitted.'
      - name: Validate secret presence without printing values
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$MERCADOPUBLICO_TICKET" || { echo 'Missing MERCADOPUBLICO_TICKET'; exit 1; }
          echo 'Required secrets are present.'
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/^Bearer[[:space:]]+//I; s/^"(.*)"$/\1/')"
          test -n "$TOKEN" || { echo 'Normalized Cloudflare token is empty'; exit 1; }
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Cloudflare token normalized; length=${#TOKEN}; value not printed."
      - name: Verify Cloudflare account token read-only
        shell: bash
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/tokens/verify`,{headers:{Authorization:`Bearer ${token}`}});
          const data=await r.json();
          if(!r.ok || !data.success || data.result?.status!=='active') throw new Error(`Cloudflare token verification failed HTTP ${r.status}`);
          console.log('Cloudflare account token: active');
          NODE
      - name: Replace Mercado Publico Worker secret
        shell: bash
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const worker=process.env.WORKER_NAME;
          const body={name:'MERCADOPUBLICO_TICKET',text:process.env.MERCADOPUBLICO_TICKET,type:'secret_text'};
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`,{
            method:'PUT',
            headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
            body:JSON.stringify(body),
          });
          const data=await r.json();
          if(!r.ok || !data.success) throw new Error(`Worker secret update failed HTTP ${r.status}: ${JSON.stringify(data.errors||[]).slice(0,600)}`);
          console.log('MERCADOPUBLICO_TICKET replaced on existing Worker; value not printed.');
          NODE
      - name: Verify health and live opportunities
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.WORKER_URL;
          const health=await fetch(base+'/health',{headers:{Accept:'application/json'}});
          const healthText=await health.text();
          if(!health.ok) throw new Error(`/health HTTP ${health.status}: ${healthText.slice(0,300)}`);
          const h=JSON.parse(healthText);
          if(!h.ok) throw new Error('/health payload is not ok');
          console.log('/health: OK');

          let last;
          for(let i=0;i<4;i++){
            const r=await fetch(base+'/api/opportunities/live',{headers:{Accept:'application/json'}});
            const text=await r.text();
            last={status:r.status,text};
            if(r.ok){
              const data=JSON.parse(text);
              if(!Array.isArray(data.items)) throw new Error('Live endpoint returned no items array');
              console.log(`/api/opportunities/live: OK; total=${data.total ?? data.items.length}`);
              for(const item of data.items.slice(0,10)){
                console.log('LIVE '+JSON.stringify({
                  codigo:item.codigo,
                  nombre:item.nombre,
                  monto_disponible_clp:item.monto_disponible_clp,
                  ofertas_recibidas:item.ofertas_recibidas,
                  organismo:item.organismo,
                  region:item.region,
                  fecha_cierre:item.fecha_cierre,
                  score:item.score,
                }));
              }
              process.exit(0);
            }
            if(i<3) await new Promise(resolve=>setTimeout(resolve,3000));
          }
          throw new Error(`/api/opportunities/live failed: HTTP ${last.status} ${last.text.slice(0,500)}`);
          NODE
      - name: Summary
        run: echo 'Ticket refreshed and live Radar verified. No D1 or resource changes performed.'
