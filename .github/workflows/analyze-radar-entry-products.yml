name: Analyze Radar Entry Products

on:
  workflow_dispatch:
  push:
    branches: [analysis/radar-vertical-decision]
    paths: ['.github/workflows/analyze-radar-entry-products.yml']

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'analysis: compare entry products on full July data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official July 2026 Compra Agil data
        run: |
          curl --fail --location --retry 3 --output /tmp/cot.zip 'https://transparenciachc.blob.core.windows.net/trnspchc/COT_2026-07.zip'
          unzip -t /tmp/cot.zip >/dev/null
      - name: Compare product subsegments on every July process
        shell: bash
        run: |
          PYTHONPATH=radar/phase0/etl python - <<'PY'
          import csv, io, re, statistics, unicodedata, zipfile
          from collections import Counter, defaultdict
          from taxonomy import classify
          from normalize import money

          TARGET={'ALIMENTOS','VEHICULOS','FERRETERIA'}
          def first(r,*ks):
              for k in ks:
                  v=r.get(k)
                  if v is not None and str(v).strip(): return str(v).strip()
          def norm(s):
              s=''.join(c for c in unicodedata.normalize('NFD',s or '') if unicodedata.category(c)!='Mn').lower()
              return ' '.join(re.findall(r'[a-z0-9]+',s))

          themes={
            'ALIMENTOS':{
              'AGUA_BEBIDAS':['agua purificada','agua mineral','agua embotellada','botella de agua','bebida','bebidas','jugo','jugos'],
              'ABARROTES':['abarrote','abarrotes','arroz','fideos','pasta','aceite vegetal','azucar','harina','sal ',' sal','legumbre','legumbres','conserva','conservas'],
              'CAFE_TEA':['cafe','te ',' te','infusion','infusiones'],
              'COLACIONES_SNACK':['colacion','colaciones','snack','snacks','galleta','galletas','barra cereal','frutos secos'],
              'COFFEE_BREAK_CATERING':['coffee break','coffe break','catering','coctel','cocktail'],
              'PANADERIA':['pan ',' pan','panaderia','panes','empanada','empanadas'],
              'FRUTAS_VERDURAS':['fruta','frutas','verdura','verduras','hortaliza','hortalizas'],
              'LACTEOS':['leche','yogur','yoghurt','queso','lacteo','lacteos'],
              'CARNES_PESCADOS':['carne','carnes','pollo','pescado','pescados','marisco','mariscos'],
            },
            'VEHICULOS':{
              'NEUMATICOS':['neumatico','neumaticos','neumático','neumáticos'],
              'BATERIAS':['bateria automotriz','baterias automotrices','bateria vehiculo','bateria de vehiculo'],
              'LUBRICANTES':['lubricante','lubricantes','aceite motor','aceite de motor','aceite automotriz','grasa automotriz'],
              'FILTROS_MANTENCION':['filtro aceite','filtro de aceite','filtro aire','filtro de aire','filtro combustible','filtro de combustible','kit mantencion','kit mantenimiento'],
              'REPUESTOS':['repuesto vehiculo','repuestos vehiculo','repuestos automotrices','repuesto automotriz','repuestos para vehiculos','repuestos para vehiculo'],
              'ACCESORIOS':['accesorio vehiculo','accesorios vehiculo','accesorios automotrices','alfombra vehiculo','fundas asiento','plumilla','plumillas'],
              'SERVICIO_MANTENCION':['mantencion vehicular','mantenimiento vehicular','reparacion vehiculo','reparacion vehicular'],
            },
            'FERRETERIA':{
              'HERRAMIENTAS_MANUALES':['herramienta manual','herramientas manuales','martillo','destornillador','alicate','llave ajustable','llave inglesa','set herramientas'],
              'PINTURAS':['pintura','pinturas','esmalte','anticorrosivo','barniz'],
              'MATERIAL_ELECTRICO':['material electrico','materiales electricos','cable electrico','cables electricos','enchufe','interruptor','canaleta electrica'],
              'FIJACIONES':['tornillo','tornillos','perno','pernos','tuerca','tuercas','arandela','arandelas','tarugo','tarugos'],
              'PLOMERIA_TUBERIAS':['tuberia','tuberias','caneria','canerias','fitting','fittings','valvula','valvulas','llave paso','codo pvc','pvc sanitario'],
              'SOLDADURA':['soldadura','electrodo','electrodos','estaño','estano'],
              'MADERA_TABLEROS':['madera','terciado','melamina','tablero osb','osb'],
              'CONSTRUCCION_PESADA':['cemento','hormigon','mortero','arena','ripio','ladrillo','ladrillos'],
            }
          }

          data={}; rows=0
          with zipfile.ZipFile('/tmp/cot.zip') as z:
              for name in sorted(n for n in z.namelist() if n.lower().endswith('.csv')):
                  with z.open(name) as f:
                      sample=f.read(131072)
                      try: sample.decode('utf-8-sig'); enc='utf-8-sig'
                      except UnicodeDecodeError: enc='cp1252'
                  print(f'{name}: {enc}')
                  with z.open(name) as f:
                      rd=csv.DictReader(io.TextIOWrapper(f,encoding=enc,errors='replace',newline=''),delimiter=';',quotechar='"')
                      for r in rd:
                          rows+=1
                          code=first(r,'CodigoCotizacion')
                          if not code: continue
                          if code not in data:
                              data[code]={'code':code,'buyer':first(r,'RazonSocialUnidaddeCompra','NombreUnidaddeCompra','NombreOOPP') or '', 'budget':money(first(r,'MontoTotalDisponble','MontoTotalDisponible')), 'suppliers':set(), 'texts':[], 'products':set()}
                          p=data[code]
                          s=first(r,'RUTProveedor','RutProveedor','RazonSocialProveedor')
                          if s: p['suppliers'].add(s)
                          vals=[first(r,k) for k in ('NombreCotizacion','DescripcionCotizacion','ProductoCotizado','NombreProductoGenerico','DetalleCotizacion')]
                          txt=' '.join(v for v in vals if v)
                          if txt and txt not in p['texts'] and len(p['texts'])<4: p['texts'].append(txt)
                          for k in ('ProductoCotizado','NombreProductoGenerico'):
                              v=first(r,k)
                              if v and len(p['products'])<25: p['products'].add(v)

          cats=Counter(); grouped=defaultdict(list); uncategorized=defaultdict(list)
          labels=defaultdict(lambda:{'processes':set(),'buyers':set(),'budgets':[],'comps':[]})
          for p in data.values():
              full=' '.join(p['texts'])
              cat=classify(full)
              if cat not in TARGET: continue
              cats[cat]+=1
              blob=norm(' '.join([full,*p['products']]))
              hits=[theme for theme,keys in themes[cat].items() if any(norm(k) in blob for k in keys)]
              if not hits: uncategorized[cat].append(p)
              for theme in hits:
                  grouped[(cat,theme)].append(p)
              for product in p['products']:
                  label=norm(product)
                  if not 4<=len(label)<=90: continue
                  d=labels[(cat,label)]
                  d['processes'].add(p['code']); d['buyers'].add(p['buyer']); d['comps'].append(len(p['suppliers']))
                  if p['budget']: d['budgets'].append(p['budget'])

          print(f'archive_rows={rows} distinct_processes={len(data)} target_counts={dict(cats)}')
          print('\nSUBSEGMENT METRICS')
          scored=[]
          for (cat,theme),items in grouped.items():
              cs=[len(p['suppliers']) for p in items]
              bs=[p['budget'] for p in items if p['budget']]
              buyers=Counter(p['buyer'] for p in items if p['buyer'])
              low=sum(1 for c in cs if 1<=c<=3)/len(cs) if cs else 0
              medc=statistics.median(cs) if cs else 99
              medb=statistics.median(bs) if bs else 0
              repeat=sum(1 for v in buyers.values() if v>=2)
              # Transparent screening score: volume, low competition, buyer recurrence, manageable ticket.
              volume=min(1,len(items)/250)
              repeat_rate=repeat/max(1,len(buyers))
              ticket_fit=1 if 250000<=medb<=2500000 else 0.6
              score=round(100*(0.35*low+0.25*volume+0.20*repeat_rate+0.10*(1-min(medc,10)/10)+0.10*ticket_fit),2)
              scored.append((score,cat,theme,len(items),medb,medc,low,len(buyers),repeat))
          for x in sorted(scored,reverse=True):
              score,cat,theme,n,medb,medc,low,buyers,repeat=x
              print(f'{cat}/{theme}: entry={score} n={n} med_budget={medb:.0f} med_comp={medc:.1f} low_comp={low:.2%} buyers={buyers} repeat_buyers={repeat}')

          print('\nTOP REPEATED PRODUCT LABELS BY CATEGORY')
          for cat in sorted(TARGET):
              candidates=[]
              for (c,label),d in labels.items():
                  if c!=cat: continue
                  n=len(d['processes'])
                  if n<3: continue
                  medc=statistics.median(d['comps']) if d['comps'] else 99
                  low=sum(1 for x in d['comps'] if 1<=x<=3)/len(d['comps']) if d['comps'] else 0
                  medb=statistics.median(d['budgets']) if d['budgets'] else 0
                  candidates.append((n,-medc,low,len(d['buyers']),medb,label))
              print(f'-- {cat} --')
              for n,negc,low,buyers,medb,label in sorted(candidates,reverse=True)[:30]:
                  print(f'n={n} buyers={buyers} med_budget={medb:.0f} med_comp={-negc:.1f} low={low:.2%} | {label}')

          print('\nLOW-COMP EXAMPLES FROM TOP THEMES')
          top_keys=[(cat,theme) for _,cat,theme,*_ in sorted(scored,reverse=True)[:8]]
          for key in top_keys:
              cat,theme=key
              print(f'-- {cat}/{theme} --')
              shown=0
              for p in sorted(grouped[key],key=lambda x:(len(x['suppliers']) or 999,-(x['budget'] or 0))):
                  c=len(p['suppliers'])
                  if 1<=c<=3:
                      print(f'c={c} budget={p["budget"]} buyer={p["buyer"]} | PRODUCTS: {" | ".join(sorted(p["products"])[:6])}')
                      shown+=1
                      if shown>=8: break
          PY
      - name: Confirm no Cloudflare access
        run: echo 'Entry-product comparison used only public ChileCompra data; no Cloudflare credentials, D1 operations, or paid resources.'
