name: Inspect ChileCompra Item Fields

on:
  push:
    branches: [analysis/radar-vertical-decision]
    paths: ['.github/workflows/analyze-radar-entry-products.yml']

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'analysis: inspect official item price fields'
    runs-on: ubuntu-latest
    steps:
      - name: Download official July 2026 Compra Agil data
        run: |
          curl --fail --location --retry 3 --output /tmp/cot.zip 'https://transparenciachc.blob.core.windows.net/trnspchc/COT_2026-07.zip'
          unzip -t /tmp/cot.zip >/dev/null
      - name: Print official CSV headers relevant to pricing and items
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, zipfile
          with zipfile.ZipFile('/tmp/cot.zip') as z:
              for name in sorted(n for n in z.namelist() if n.lower().endswith('.csv')):
                  with z.open(name) as f:
                      sample=f.read(131072)
                      try: sample.decode('utf-8-sig'); enc='utf-8-sig'
                      except UnicodeDecodeError: enc='cp1252'
                  with z.open(name) as f:
                      rd=csv.DictReader(io.TextIOWrapper(f,encoding=enc,errors='replace',newline=''),delimiter=';',quotechar='"')
                      fields=rd.fieldnames or []
                      print(name, enc, 'columns=',len(fields))
                      for field in fields:
                          low=field.lower()
                          if any(k in low for k in ['precio','monto','cantidad','unidad','producto','proveedor','seleccion','cotizacion','item','codigooc']):
                              print('  ',repr(field))
                      first=next(rd,None) or {}
                      print('SAMPLE NONEMPTY RELEVANT VALUES')
                      for field in fields:
                          low=field.lower()
                          if any(k in low for k in ['precio','monto','cantidad','unidad','producto','proveedor','seleccion','item']) and first.get(field):
                              print('  ',repr(field),'=',repr(str(first[field])[:160]))
          PY
      - name: Confirm no Cloudflare access
        run: echo 'Header inspection used only public ChileCompra data; no Cloudflare credentials or writes.'
