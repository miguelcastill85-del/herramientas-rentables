name: Confirm Clean Fastening Demand

on:
  push:
    branches: [analysis/radar-vertical-decision]
    paths: ['.github/workflows/analyze-radar-entry-products.yml']

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.event.head_commit.message == 'analysis: confirm clean fastening demand on full July data'
    runs-on: ubuntu-latest
    steps:
      - name: Download official July 2026 Compra Agil data
        run: |
          curl --fail --location --retry 3 --output /tmp/cot.zip 'https://transparenciachc.blob.core.windows.net/trnspchc/COT_2026-07.zip'
          unzip -t /tmp/cot.zip >/dev/null
      - name: Apply process-wide medical exclusion and confirm demand
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, re, statistics, unicodedata, zipfile
          from collections import Counter, defaultdict

          TARGETS={'tornillos para madera','clavo tornillo','tornillos de anclaje','pernos de anclaje'}
          BASELINE={'tornillos para madera':154,'clavo tornillo':117,'tornillos de anclaje':86,'pernos de anclaje':77}
          def norm(s):
              s=''.join(c for c in unicodedata.normalize('NFD',s or '') if unicodedata.category(c)!='Mn').lower()
              return ' '.join(re.findall(r'[a-z0-9]+',s))
          TARGETS={norm(x) for x in TARGETS}
          health=['hospital','servicio de salud','cesfam','clinica','consultorio','salud municipal','hospital militar','centro asistencial']
          medical=['ortoped','quirurg','implante','protes','trauma','crane','kirsch','endomed','trocant','gamma','fractura','osteosint','artrosc','artroplast','femur','tibia','perone','placa matta','tejido blando','instrumental medico','instrumental quirurg','paciente']
          physical=['tornill','perno','clavo','autoperfor','vulcanita','yeso carton','madera','anclaje','metal','roscalata','roscador','lenteja','punta broca','hexagonal','cemento','techo','fijacion']

          proc={}
          with zipfile.ZipFile('/tmp/cot.zip') as z:
              for name in sorted(n for n in z.namelist() if n.lower().endswith('.csv')):
                  with z.open(name) as f:
                      sample=f.read(131072)
                      try: sample.decode('utf-8-sig'); enc='utf-8-sig'
                      except UnicodeDecodeError: enc='cp1252'
                  with z.open(name) as f:
                      rd=csv.DictReader(io.TextIOWrapper(f,encoding=enc,errors='replace',newline=''),delimiter=';',quotechar='"')
                      for r in rd:
                          code=(r.get('CodigoCotizacion') or '').strip()
                          if not code: continue
                          p=proc.setdefault(code,{'buyer':(r.get('RazonSocialUnidaddeCompra') or r.get('NombreUnidaddeCompra') or '').strip(),'region':(r.get('Region') or '').strip(),'suppliers':set(),'labels':set(),'blob':[]})
                          sup=(r.get('RUTProveedor') or r.get('RazonSocialProveedor') or '').strip()
                          if sup: p['suppliers'].add(sup)
                          generic=norm(r.get('NombreProductoGenerico'))
                          if generic: p['labels'].add(generic)
                          p['blob'].append(' '.join(filter(None,[r.get('NombreCotizacion'),r.get('DescripcionCotizacion'),r.get('ProductoCotizado'),r.get('NombreProductoGenerico'),r.get('DetalleCotizacion')])))

          groups=defaultdict(list); reasons=Counter()
          for code,p in proc.items():
              targets=p['labels'] & TARGETS
              if not targets: continue
              b=norm(p['buyer']); blob=norm(' '.join(p['blob']))
              if any(x in b for x in health): reasons['health_buyer']+=1; continue
              if any(x in blob for x in medical): reasons['medical_text']+=1; continue
              if not any(x in blob for x in physical): reasons['not_physical_fastener']+=1; continue
              for label in targets: groups[label].append((code,p))

          print('ULTRA-STRICT CLEAN FASTENING DEMAND')
          stable=True
          for label in sorted(TARGETS):
              items=groups[label]; n=len(items); base=BASELINE[label]
              retained=n/base if base else 0
              comps=[len(p['suppliers']) for _,p in items]
              observed=[c for c in comps if c>0]
              low=sum(1<=c<=3 for c in observed)/len(observed) if observed else 0
              buyers=Counter(p['buyer'] for _,p in items if p['buyer'])
              regions=Counter(p['region'] for _,p in items if p['region'])
              medc=statistics.median(comps) if comps else 0
              print(f'{label}: clean_n={n} baseline_n={base} retained={retained:.2%} med_comp={medc:.1f} low_comp={low:.2%} buyers={len(buyers)} repeat_buyers={sum(v>=2 for v in buyers.values())} regions={len(regions)} top_buyer={(max(buyers.values())/sum(buyers.values()) if buyers else 0):.2%}')
              if retained < 0.85: stable=False
          print('exclusions=',dict(reasons))
          print('HYPOTHESIS_STABLE=',stable)
          if not stable:
              raise SystemExit('Fastening hypothesis lost more than 15% after strict cleaning')
          PY
      - name: Confirm no Cloudflare access
        run: echo 'Strict fastening validation used only public ChileCompra data; no Cloudflare credentials, D1 operations, or paid resources.'
