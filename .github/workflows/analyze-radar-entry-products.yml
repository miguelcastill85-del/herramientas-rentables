name: Extract Recurring Fastening Pack Specs

on:
  push:
    branches: [analysis/radar-vertical-decision]
    paths: ['.github/workflows/analyze-radar-entry-products.yml']

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.event.head_commit.message == 'analysis: extract recurring fastening pack specs'
    runs-on: ubuntu-latest
    steps:
      - name: Download official July 2026 Compra Agil data
        run: |
          curl --fail --location --retry 3 --output /tmp/cot.zip 'https://transparenciachc.blob.core.windows.net/trnspchc/COT_2026-07.zip'
          unzip -t /tmp/cot.zip >/dev/null
      - name: Extract clean repeated dimensions and pack formats
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, re, unicodedata, zipfile
          from collections import Counter, defaultdict

          TARGETS={'tornillos para madera','clavo tornillo','tornillos de anclaje','pernos de anclaje'}
          def norm(s):
              s=''.join(c for c in unicodedata.normalize('NFD',s or '') if unicodedata.category(c)!='Mn').lower()
              return ' '.join(re.findall(r'[a-z0-9/"\.]+',s))
          TARGETS={norm(x) for x in TARGETS}
          health=['hospital','servicio de salud','cesfam','clinica','consultorio','salud municipal','hospital militar','centro asistencial']
          medical=['ortoped','quirurg','implante','protes','trauma','crane','kirsch','endomed','trocant','gamma','fractura','osteosint','artrosc','artroplast','femur','tibia','perone','paciente']

          proc={}
          with zipfile.ZipFile('/tmp/cot.zip') as z:
              for name in sorted(n for n in z.namelist() if n.lower().endswith('.csv')):
                  with z.open(name) as f:
                      sample=f.read(131072)
                      try: sample.decode('utf-8-sig'); enc='utf-8-sig'
                      except UnicodeDecodeError: enc='cp1252'
                  with z.open(name) as f:
                      rd=csv.DictReader(io.TextIOWrapper(f,encoding=enc,errors='replace',newline=''),delimiter=';',quotechar='"')
                      for r in rd:
                          code=(r.get('CodigoCotizacion') or '').strip()
                          if not code: continue
                          p=proc.setdefault(code,{'buyer':(r.get('RazonSocialUnidaddeCompra') or r.get('NombreUnidaddeCompra') or '').strip(),'labels':set(),'texts':defaultdict(set)})
                          generic=norm(r.get('NombreProductoGenerico'))
                          if generic: p['labels'].add(generic)
                          if generic in TARGETS:
                              text=' '.join(filter(None,[r.get('ProductoCotizado'),r.get('DetalleCotizacion')]))
                              if text: p['texts'][generic].add(text.strip())

          sizes=defaultdict(Counter); packs=defaultdict(Counter); features=defaultdict(Counter); examples=defaultdict(list)
          for p in proc.values():
              b=norm(p['buyer'])
              all_text=norm(' '.join(t for vals in p['texts'].values() for t in vals))
              if any(x in b for x in health) or any(x in all_text for x in medical): continue
              for label in p['labels'] & TARGETS:
                  text=' '.join(p['texts'][label]); nt=norm(text)
                  if not nt: continue
                  # Common inch dimensions: e.g. 1 1/4", 2 1/2", 1/2", 2"; and gauge x length forms like 6x1 1/4.
                  found=[]
                  for m in re.findall(r'(?<!\d)(\d{1,2}(?:\s+\d/\d|/\d)?)(?:\s*(?:pulgadas?|pulg|\"))', nt):
                      found.append(m.strip()+' pulg')
                  for m in re.findall(r'(?<!\d)(\d{1,2})\s*[xX]\s*(\d{1,2}(?:\s+\d/\d|/\d)?)(?:\s*(?:pulgadas?|pulg|\"))?', text, flags=re.I):
                      found.append(f'{m[0]} x {m[1]}')
                  for s in set(found): sizes[label][s]+=1
                  for m in re.findall(r'(?:caja|bolsa|pack|paquete)(?:\s+de)?\s+(\d{2,5})\s+(?:unidades?|unid|uds?)', nt):
                      packs[label][m+' unidades']+=1
                  for m in re.findall(r'(\d{2,5})\s+(?:unidades?|unid|uds?)', nt):
                      if int(m)<=5000: packs[label][m+' unidades']+=1
                  for key in ['autoperforante','punta broca','cabeza lenteja','cabeza trompeta','zincado','hexagonal','yeso carton','vulcanita','roscalata']:
                      if key in nt: features[label][key]+=1
                  if len(examples[label])<15:
                      examples[label].append(text[:300].replace('\n',' '))

          for label in sorted(TARGETS):
              print('\n--',label,'--')
              print('TOP_SIZES',sizes[label].most_common(12))
              print('TOP_PACKS',packs[label].most_common(12))
              print('TOP_FEATURES',features[label].most_common(12))
              print('EXAMPLES')
              for e in examples[label][:8]: print(e)
          PY
      - name: Confirm no Cloudflare access
        run: echo 'Pack-spec analysis used only public ChileCompra data; no Cloudflare credentials, D1 operations, or paid resources.'
