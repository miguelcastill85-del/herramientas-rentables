name: Analyze Radar Laboratorio

on:
  workflow_dispatch:
  push:
    branches: [analysis/radar-vertical-decision]
    paths:
      - '.github/workflows/analyze-radar-laboratorio.yml'

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'analysis: inspect laboratorio subverticals read only'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Resolve exact D1 read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_API_TOKEN" == cfat_* ]]
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=radar-rentable-estado&per_page=10" >/tmp/d1.json
          DB_ID="$(node -e 'const x=require("/tmp/d1.json");const m=(x.result||[]).filter(v=>v.name==="radar-rentable-estado");if(!x.success||m.length!==1)process.exit(1);process.stdout.write(m[0].uuid)')"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Read Laboratorio process titles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          sql="""SELECT title, budget_clp, competitor_count, selected_amount_clp, buyer_id, region
          FROM compra_agil_raw
          WHERE category='LABORATORIO'
          ORDER BY competitor_count ASC, budget_clp DESC;"""
          open('/tmp/query.json','w',encoding='utf-8').write(json.dumps({'sql':sql}, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/query" >/tmp/lab.json
          node -e 'const x=require("/tmp/lab.json");if(!x.success)process.exit(1);const m=x.result?.[0]?.meta||{};console.log(`D1 rows_read=${m.rows_read??"n/a"}; rows_written=${m.rows_written??0}`);if((m.rows_written||0)!==0)process.exit(1)'

      - name: Cluster low-regulation versus regulated-risk demand
        shell: bash
        run: |
          python - <<'PY'
          import json, re, statistics, unicodedata
          from collections import Counter, defaultdict

          x=json.load(open('/tmp/lab.json', encoding='utf-8'))
          rows=(x.get('result') or [{}])[0].get('results') or []
          if len(rows) < 300:
              raise SystemExit(f'Unexpected Laboratorio sample size: {len(rows)}')

          def norm(s):
              s=''.join(c for c in unicodedata.normalize('NFD', s or '') if unicodedata.category(c)!='Mn').lower()
              return ' '.join(re.findall(r'[a-z0-9]+', s))

          regulated=[
              'reactivo','reactivos','diagnostico','diagnostica','pcr','test','ensayo clinico',
              'calibrador','control calidad','inmuno','serologia','microbiologia','cultivo',
              'hematologia','bioquimica','coagulacion','anticuerpo','antigeno','kit diagnostico'
          ]
          equipment=[
              'centrifuga','microscopio','espectro','balanza','agitador','incubadora','autoclave',
              'refrigerador','freezer','congelador','horno','equipo laboratorio','instrumento laboratorio',
              'medidor','fotometro','analizador'
          ]
          consumables=[
              'pipeta','micropipeta','punta','puntas','tubo','tubos','placa','placas','frasco','frascos',
              'probeta','matraz','matraces','vidrio','portaobjeto','cubreobjeto','cubeta','cubetas',
              'papel filtro','filtro','filtros','gradilla','gradillas','recipiente','botella','botellas',
              'material laboratorio','materiales laboratorio','insumo laboratorio','insumos laboratorio'
          ]

          def cluster(title):
              t=norm(title)
              if any(k in t for k in regulated): return 'REACTIVOS_DIAGNOSTICO'
              if any(k in t for k in equipment): return 'EQUIPAMIENTO'
              if any(k in t for k in consumables): return 'CONSUMIBLES'
              return 'GENERAL_LAB'

          groups=defaultdict(list)
          for r in rows:
              groups[cluster(r.get('title'))].append(r)

          print(f'LABORATORIO total={len(rows)}')
          for name, items in sorted(groups.items(), key=lambda kv:len(kv[1]), reverse=True):
              budgets=[float(i['budget_clp']) for i in items if i.get('budget_clp')]
              comps=[float(i['competitor_count']) for i in items if i.get('competitor_count') is not None]
              low=sum(1 for c in comps if 1 <= c <= 3) / len(comps) if comps else 0
              observed=sum(1 for i in items if i.get('selected_amount_clp')) / len(items)
              print(
                  f'{name}: processes={len(items)}, share={len(items)/len(rows):.2%}, '
                  f'median_budget={statistics.median(budgets) if budgets else None:.0f}, '
                  f'median_competitors={statistics.median(comps) if comps else 0:.1f}, '
                  f'low_comp={low:.2%}, price_coverage={observed:.2%}'
              )

          stop={'laboratorio','laboratorios','adquisicion','adquisici','compra','cotizacion','insumo','insumos','material','materiales','para','del','de','la','el','los','las','y','en','por','con','un','una','se','a','que','su','sus','al','2026','2025','servicio','servicios','suministro','provision','unidad','municipalidad','hospital','cesfam'}
          words=Counter(); bigrams=Counter()
          for r in rows:
              toks=[t for t in norm(r.get('title')).split() if t not in stop and len(t)>=3 and not t.isdigit()]
              words.update(set(toks))
              bigrams.update(set(' '.join(toks[i:i+2]) for i in range(len(toks)-1)))
          print('\nTOP LAB WORDS')
          for k,v in words.most_common(35): print(f'{v:4d} {k}')
          print('\nTOP LAB BIGRAMS')
          for k,v in bigrams.most_common(30): print(f'{v:4d} {k}')

          print('\nLOW-COMP EXAMPLES (titles only)')
          shown=0
          for r in rows:
              if 1 <= float(r.get('competitor_count') or 0) <= 2 and r.get('title'):
                  print(f"c={r['competitor_count']} budget={r.get('budget_clp')} | {r['title']}")
                  shown += 1
                  if shown >= 25: break
          PY

      - name: Confirm zero writes
        run: echo 'Laboratorio subvertical analysis completed read-only; no D1 mutation or Cloudflare resource operation executed.'
