name: Ingest Radar Public Data

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Periodo AAAA-MM de Compra Ágil'
        required: true
        default: '2026-07'
      max_processes:
        description: 'Procesos a consolidar (10000-20000)'
        required: true
        default: '15000'
      confirm_free_only:
        description: 'Confirmar Workers Free + D1 Free, sin upgrades ni recursos pagados'
        required: true
        type: boolean
        default: false
  push:
    branches: [feat/radar-public-data-ingestion]
    paths:
      - '.github/workflows/ingest-radar-public-data.yml'

concurrency:
  group: ingest-radar-public-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      PERIOD: ${{ github.event.inputs.period || '2026-07' }}
      MAX_PROCESSES: ${{ github.event.inputs.max_processes || '15000' }}
      CONFIRM_FREE_ONLY: ${{ github.event_name == 'push' && 'true' || github.event.inputs.confirm_free_only }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_URL: https://radar-rentable-estado.miguelcastill85.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-cost and resource-name guards
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_FREE_ONLY" = 'true' || { echo 'Blocked: free-only confirmation required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [[ "$CLOUDFLARE_API_TOKEN" == cfat_* ]] || { echo 'Expected Account API Token'; exit 1; }
          [[ "$PERIOD" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]] || { echo 'Invalid period'; exit 1; }
          test "$MAX_PROCESSES" -ge 10000 && test "$MAX_PROCESSES" -le 20000 || { echo 'Blocked: process count outside free-only guard'; exit 1; }
          echo 'Free-only guard: active. Existing Worker/D1 names are fixed; this workflow creates no Cloudflare resource.'

      - name: Verify active token and exact existing D1 before download
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          test "$STATUS" = 200 || { echo "Token verification HTTP $STATUS"; exit 1; }
          node -e 'const x=require("/tmp/verify.json");if(!x.success||x.result?.status!=="active")process.exit(1)'

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=radar-rentable-estado&per_page=10" >/tmp/d1.json
          node - <<'NODE'
          const x=require('/tmp/d1.json');
          const matches=(x.result||[]).filter(d=>d.name==='radar-rentable-estado');
          if(!x.success||matches.length!==1){console.error(`Expected exactly one D1 radar-rentable-estado; found ${matches.length}`);process.exit(1)}
          console.log('Exact existing D1 verified; no database creation will occur.');
          NODE

      - name: Download official ChileCompra public Compra Agil archive
        shell: bash
        run: |
          set -euo pipefail
          URL="https://transparenciachc.blob.core.windows.net/trnspchc/COT_${PERIOD}.zip"
          echo "Downloading official ChileCompra open data for ${PERIOD}"
          curl --fail --location --retry 3 --output /tmp/compra-agil.zip "$URL"
          unzip -t /tmp/compra-agil.zip >/dev/null

      - name: Prepare free-tier-sized real process set before any D1 write
        shell: bash
        run: |
          set -euo pipefail
          python radar/phase0/etl/prepare_open_data.py /tmp/compra-agil.zip \
            --period "$PERIOD" \
            --max-processes "$MAX_PROCESSES" \
            --out /tmp/prepared.json
          python - <<'PY'
          import json, os
          x=json.load(open('/tmp/prepared.json', encoding='utf-8'))
          n=x['summary']['processes']
          assert 10000 <= n <= 20000, n
          assert n == int(os.environ['MAX_PROCESSES']), (n, os.environ['MAX_PROCESSES'])
          assert x['summary']['categories'] > 0
          assert any((p.get('buyer_id') or '').strip() for p in x['processes'])
          assert any((p.get('selected_supplier_id') or '').strip() for p in x['processes'])
          print(f'Prepared {n} real processes; free-only write guard passed.')
          PY

      - name: Apply idempotent public-data load to existing D1
        shell: bash
        run: |
          set -euo pipefail
          python radar/phase0/etl/open_data_ingest.py apply /tmp/prepared.json

      - name: Verify Worker health and D1-backed ranking
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error "$WORKER_URL/health")"
          printf '%s' "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.ok!==true)process.exit(1)})'
          curl --fail --silent --show-error "$WORKER_URL/api/categories" >/tmp/categories.json
          node - <<'NODE'
          const x=require('/tmp/categories.json');
          if(!Array.isArray(x.items)||x.items.length===0){console.error('Expected non-empty D1-backed categories');process.exit(1)}
          const named=x.items.filter(v=>v.category!=='OTROS').slice(0,8);
          console.log(`D1-backed categories endpoint OK; rows=${x.items.length}`);
          console.log('Named vertical ranking:');
          for (const v of named) console.log(`${v.category}: score=${v.opportunity_market_score}, processes=${v.process_count}`);
          NODE

      - name: Zero-cost ingestion summary
        shell: bash
        run: |
          {
            echo '### Radar public-data ingestion'
            echo "- Source: ChileCompra Datos Abiertos COT_${PERIOD}"
            echo "- Prepared processes: ${MAX_PROCESSES}"
            echo '- D1: radar-rentable-estado (existing only; no duplicate creation path)'
            echo '- Worker: radar-rentable-estado (not redeployed)'
            echo '- /health: OK'
            echo '- /api/categories: non-empty and D1-backed'
            echo '- Cost guard: Workers Free + D1 Free only; no upgrade operation'
          } >> "$GITHUB_STEP_SUMMARY"
