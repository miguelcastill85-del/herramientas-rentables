name: Deploy Radar Rentable

on:
  workflow_dispatch:
  push:
    branches: [ops/run-radar-deploy]
    paths:
      - '.github/workflows/deploy-radar.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Validate corrected token without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const raw=process.env.CLOUDFLARE_API_TOKEN||'';
          let t=raw.trim();
          if(/^Bearer\s+/i.test(t)) t=t.replace(/^Bearer\s+/i,'').trim();
          if((t.startsWith('"')&&t.endsWith('"'))||(t.startsWith("'")&&t.endsWith("'"))) t=t.slice(1,-1).trim();
          const kind=t.startsWith('cfat_')?'account':t.startsWith('cfut_')?'user':'legacy-or-unrecognized';
          console.log(`Token kind detected: ${kind}; length=${t.length}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`CF_TOKEN=${t}\nTOKEN_KIND=${kind}\n`);
          NODE

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TOKEN_KIND" = 'account' ]; then
            VERIFY_URL="$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          else
            VERIFY_URL="$CF_API/user/tokens/verify"
          fi
          STATUS="$(curl --silent --show-error -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$VERIFY_URL")"
          echo "Verification HTTP status: $STATUS"
          node -e 'const fs=require("fs");let x={};try{x=JSON.parse(fs.readFileSync("/tmp/verify.json","utf8"))}catch{};if(x.success){console.log(`Token verification: success; status=${x.result?.status||"unknown"}`)}else{for(const e of (x.errors||[]))console.log(`Cloudflare error ${e.code||"unknown"}: ${e.message||"unknown"}`)}'
          test "$STATUS" = '200'
          node -e 'const x=require("/tmp/verify.json");if(!x.success||x.result?.status!=="active")process.exit(1)'

      - name: Read-only D1 permission check
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error -o /tmp/d1.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=radar-rentable-estado&per_page=5")"
          echo "D1 read HTTP status: $STATUS"
          node -e 'const fs=require("fs");let x={};try{x=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"))}catch{};if(x.success){const d=(x.result||[]).find(v=>v.name==="radar-rentable-estado");console.log(d?"Exact D1 database already exists":"Exact D1 database not found") }else{for(const e of (x.errors||[]))console.log(`Cloudflare error ${e.code||"unknown"}: ${e.message||"unknown"}`)}'
          test "$STATUS" = '200'
          node -e 'const x=require("/tmp/d1.json");if(!x.success)process.exit(1)'
