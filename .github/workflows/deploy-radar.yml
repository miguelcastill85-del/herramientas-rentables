name: Deploy Radar Rentable

on:
  workflow_dispatch:
    inputs:
      confirm_free_only:
        description: 'Confirmar que este despliegue se hará únicamente con Workers Free + D1 Free, sin upgrades ni servicios de pago'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
      CONFIRM_FREE_ONLY: ${{ inputs.confirm_free_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Enforce free-only deployment guard
        shell: bash
        run: |
          test "$CONFIRM_FREE_ONLY" = "true" || {
            echo 'Deployment blocked: free-only confirmation is required.'
            exit 1
          }
          echo 'Free-only guard confirmed. This workflow does not enable or upgrade any Cloudflare paid plan.'
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$MERCADOPUBLICO_TICKET" || { echo 'Missing MERCADOPUBLICO_TICKET'; exit 1; }
      - name: Verify Cloudflare authentication
        run: pnpm exec wrangler whoami
      - name: Ensure D1 database exists and patch Worker config
        shell: bash
        run: |
          set -euo pipefail
          DB_NAME='radar-rentable-estado'
          find_id() {
            pnpm exec wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const db=x.find(v=>v.name===process.argv[1]);if(db)process.stdout.write(db.uuid||db.id||"")})' "$DB_NAME"
          }
          DB_ID="$(find_id)"
          if [ -z "$DB_ID" ]; then
            pnpm exec wrangler d1 create "$DB_NAME"
            DB_ID="$(find_id)"
          fi
          test -n "$DB_ID" || { echo 'Could not resolve D1 database id'; exit 1; }
          node -e "const fs=require('fs');const p='radar/phase0/wrangler.jsonc';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('REEMPLAZAR_DESPUES_DE_CREAR_D1',process.argv[1]))" "$DB_ID"
      - name: Apply D1 schemas
        working-directory: radar/phase0
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute radar-rentable-estado --remote --file ./sql/001_schema.sql
          pnpm exec wrangler d1 execute radar-rentable-estado --remote --file ./sql/002_real_ingestion.sql
      - name: Store Mercado Público ticket as Worker secret
        working-directory: radar/phase0
        run: printf '%s' "$MERCADOPUBLICO_TICKET" | pnpm exec wrangler secret put MERCADOPUBLICO_TICKET
      - name: Validate deployment
        working-directory: radar/phase0
        run: pnpm exec wrangler deploy --dry-run
      - name: Deploy Worker
        working-directory: radar/phase0
        run: pnpm exec wrangler deploy
