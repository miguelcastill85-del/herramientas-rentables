name: Deploy Radar Rentable

on:
  workflow_dispatch:
    inputs:
      confirm_free_only:
        description: 'Confirmar que este despliegue se hará únicamente con Workers Free + D1 Free, sin upgrades ni servicios de pago'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
      CONFIRM_FREE_ONLY: ${{ inputs.confirm_free_only }}
      WORKER_NAME: radar-rentable-estado
      DB_NAME: radar-rentable-estado
      WORKER_URL: https://radar-rentable-estado.miguelcastill85.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Enforce free-only deployment guard
        shell: bash
        run: |
          test "$CONFIRM_FREE_ONLY" = "true" || {
            echo 'Deployment blocked: free-only confirmation is required.'
            exit 1
          }
          echo 'Free-only guard confirmed.'
          echo 'This workflow reuses the existing Worker and D1 only.'
          echo 'No D1 writes, schema changes, resource creation, billing changes, upgrades, KV, R2, Queues, AI, or paid services are permitted.'
      - name: Validate Cloudflare secrets without printing them
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          if [ -n "$MERCADOPUBLICO_TICKET" ]; then
            echo 'MERCADOPUBLICO_TICKET is present and will be restored server-side after upload.'
          else
            echo 'MERCADOPUBLICO_TICKET is absent; deploy will continue and Radar will use public-search fallback.'
          fi
      - name: Normalize Cloudflare account token
        shell: bash
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/^Bearer[[:space:]]+//I; s/^"(.*)"$/\1/')"
          test -n "$TOKEN" || { echo 'Normalized token is empty'; exit 1; }
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Cloudflare token normalized; length=${#TOKEN}; value not printed."
      - name: Verify account token and resolve exact existing D1 read-only
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const fs=await import('node:fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const dbName=process.env.DB_NAME;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function cf(path){
            const r=await fetch(`https://api.cloudflare.com/client/v4${path}`,{headers});
            const text=await r.text();
            let data; try{data=JSON.parse(text)}catch{throw new Error(`Cloudflare HTTP ${r.status}: non-JSON response`)}
            if(!r.ok || !data.success) throw new Error(`Cloudflare HTTP ${r.status}: ${JSON.stringify(data.errors||[]).slice(0,700)}`);
            return data;
          }
          const verify=await cf(`/accounts/${account}/tokens/verify`);
          if(verify.result?.status!=='active') throw new Error(`Cloudflare account token status is ${verify.result?.status}`);
          console.log('Cloudflare account token: active');
          const list=await cf(`/accounts/${account}/d1/database?name=${encodeURIComponent(dbName)}&per_page=10`);
          const matches=(list.result||[]).filter(x=>x.name===dbName);
          if(matches.length!==1) throw new Error(`Expected exactly one existing D1 named ${dbName}; found ${matches.length}. Deployment stopped before writes.`);
          const id=matches[0].uuid||matches[0].id;
          if(!id) throw new Error('Existing D1 has no id');
          fs.appendFileSync(process.env.GITHUB_ENV,`DB_ID=${id}\n`);
          console.log(`Existing D1 resolved exactly once: ${dbName}; reused=true; created=false`);
          NODE
      - name: Patch local config and read compatibility date
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const fs=require('fs');
          const p='radar/phase0/wrangler.jsonc';
          let text=fs.readFileSync(p,'utf8');
          text=text.replace('REEMPLAZAR_DESPUES_DE_CREAR_D1',process.env.DB_ID);
          fs.writeFileSync(p,text);
          const match=text.match(/"compatibility_date"\s*:\s*"([^"]+)"/);
          if(!match) throw new Error('Could not read compatibility_date from wrangler.jsonc');
          fs.appendFileSync(process.env.GITHUB_ENV,`COMPAT_DATE=${match[1]}\n`);
          console.log(`Local config patched; compatibility_date=${match[1]}`);
          NODE
      - name: Dry-run before any remote writes
        working-directory: radar/phase0
        shell: bash
        run: |
          rm -rf ../../dist-radar
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID pnpm exec wrangler deploy --dry-run --outdir ../../dist-radar
          mapfile -t bundles < <(find ../../dist-radar -type f \( -name '*.js' -o -name '*.mjs' \))
          test "${#bundles[@]}" -eq 1 || { echo "Expected exactly one JS module bundle, found ${#bundles[@]}"; exit 1; }
          ABS_BUNDLE="$(realpath "${bundles[0]}")"
          test -f "$ABS_BUNDLE" || { echo 'Resolved bundle path is not a file'; exit 1; }
          echo "BUNDLE_PATH=$ABS_BUNDLE" >> "$GITHUB_ENV"
          echo 'Dry-run succeeded before remote writes.'
      - name: Upload existing Worker with existing D1 binding
        shell: bash
        run: |
          node - <<'NODE'
          const fs=await import('node:fs');
          const path=await import('node:path');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const worker=process.env.WORKER_NAME;
          const dbId=process.env.DB_ID;
          const file=process.env.BUNDLE_PATH;
          const moduleName=path.basename(file);
          const metadata={
            main_module:moduleName,
            compatibility_date:process.env.COMPAT_DATE,
            bindings:[{type:'d1',name:'DB',database_id:dbId}],
          };
          const form=new FormData();
          form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}),'metadata.json');
          form.append(moduleName,new Blob([fs.readFileSync(file)],{type:'application/javascript+module'}),moduleName);
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}`,{
            method:'PUT',
            headers:{Authorization:`Bearer ${token}`},
            body:form,
          });
          const text=await r.text();
          let data; try{data=JSON.parse(text)}catch{data={success:false,errors:[{message:'non-JSON response'}]}};
          if(!r.ok || !data.success) throw new Error(`Worker upload failed HTTP ${r.status}: ${JSON.stringify(data.errors||[]).slice(0,900)}`);
          console.log(`Existing Worker updated: ${worker}; D1 reused; no new Worker or D1 created.`);
          NODE
      - name: Restore Mercado Publico ticket if present
        if: ${{ env.MERCADOPUBLICO_TICKET != '' }}
        shell: bash
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const worker=process.env.WORKER_NAME;
          const body={name:'MERCADOPUBLICO_TICKET',text:process.env.MERCADOPUBLICO_TICKET,type:'secret_text'};
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`,{
            method:'PUT',
            headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
            body:JSON.stringify(body),
          });
          const data=await r.json();
          if(!r.ok || !data.success) throw new Error(`Worker secret restore failed HTTP ${r.status}: ${JSON.stringify(data.errors||[]).slice(0,700)}`);
          console.log('Mercado Publico ticket restored server-side; value not printed.');
          NODE
      - name: Verify production health and live endpoint
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.WORKER_URL;
          const nonce=Date.now();
          async function get(path){
            let last;
            for(let i=0;i<5;i++){
              const separator=path.includes('?')?'&':'?';
              const url=`${base}${path}${separator}verify=${nonce}-${i}`;
              const r=await fetch(url,{headers:{Accept:'application/json','cache-control':'no-cache'}});
              const text=await r.text();
              last={r,text};
              if(r.ok) return last;
              if(i<4) await new Promise(resolve=>setTimeout(resolve,3000));
            }
            throw new Error(`${path} failed HTTP ${last.r.status}: ${last.text.slice(0,500)}`);
          }
          const health=await get('/health');
          const h=JSON.parse(health.text);
          if(!h.ok) throw new Error('/health payload is not ok');
          console.log('/health cache-busted: OK');
          const live=await get('/api/opportunities/live');
          const body=JSON.parse(live.text);
          if(!['api_v2','public_search_fallback'].includes(body.mode)) throw new Error(`Unexpected live mode: ${body.mode}`);
          if(body.focus!=='canastas_ferreteria_mantenimiento') throw new Error(`Unexpected focus: ${body.focus}`);
          if(body.target_budget_clp?.min!==300000 || body.target_budget_clp?.max!==3000000) throw new Error('Target budget metadata is wrong');
          console.log(`live mode=${body.mode}; api_status=${body.api_status||'ok'}; total=${body.total ?? 'unknown'}; focus=${body.focus}`);
          if(body.mode==='public_search_fallback'){
            if(!Array.isArray(body.searches) || body.searches.length!==6) throw new Error(`Fallback must expose six official public searches; got ${body.searches?.length}`);
            for(const entry of body.searches){
              const u=new URL(entry.url);
              if(u.hostname!=='buscador.mercadopublico.cl' || u.pathname!=='/compra-agil') throw new Error('Fallback contains non-official search URL');
            }
            console.log('Public-search fallback verified with six official Mercado Público links.');
          } else if(!Array.isArray(body.items)) {
            throw new Error('API mode has no items array');
          }
          NODE
      - name: Summary
        run: |
          echo 'Safe manual deploy complete: dry-run before writes, exact D1 reused, existing Worker updated, free-only.'
