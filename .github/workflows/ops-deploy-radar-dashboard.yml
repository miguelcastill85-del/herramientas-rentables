name: Ops Deploy Radar Dashboard

on:
  push:
    branches: [ops/deploy-radar-dashboard]
    paths: ['.github/workflows/ops-deploy-radar-dashboard.yml']

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.head_commit.message == 'ops: deploy Radar dashboard safely'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
      WORKER_NAME: radar-rentable-estado
      DB_NAME: radar-rentable-estado
      WORKER_URL: https://radar-rentable-estado.miguelcastill85.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Zero-cost guard
        run: |
          echo 'Update existing Worker only; reuse exactly one existing D1.'
          echo 'No D1 writes, schema changes, resource creation, upgrades, billing changes, KV, R2, Queues, AI, or paid services.'
      - name: Validate secrets without printing values
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          if [ -n "$MERCADOPUBLICO_TICKET" ]; then echo 'Mercado Publico ticket present; value not printed.'; else echo 'Ticket absent; public fallback remains usable.'; fi
      - name: Normalize Cloudflare token
        shell: bash
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/^Bearer[[:space:]]+//I; s/^"(.*)"$/\1/')"
          test -n "$TOKEN" || { echo 'Normalized Cloudflare token is empty'; exit 1; }
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Cloudflare token normalized; length=${#TOKEN}; value not printed."
      - name: Verify account and resolve exact existing D1 read-only
        shell: bash
        run: |
          node - <<'NODE'
          const fs=await import('node:fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const dbName=process.env.DB_NAME;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function cf(path){
            const r=await fetch(`https://api.cloudflare.com/client/v4${path}`,{headers});
            const data=await r.json();
            if(!r.ok || !data.success) throw new Error(`Cloudflare HTTP ${r.status}: ${JSON.stringify(data.errors||[]).slice(0,600)}`);
            return data;
          }
          const verify=await cf(`/accounts/${account}/tokens/verify`);
          if(verify.result?.status!=='active') throw new Error('Cloudflare account token is not active');
          const list=await cf(`/accounts/${account}/d1/database?name=${encodeURIComponent(dbName)}&per_page=10`);
          const matches=(list.result||[]).filter(x=>x.name===dbName);
          if(matches.length!==1) throw new Error(`Expected exactly one existing D1 ${dbName}; found ${matches.length}. No writes performed.`);
          const id=matches[0].uuid||matches[0].id;
          if(!id) throw new Error('Existing D1 has no id');
          fs.appendFileSync(process.env.GITHUB_ENV,`DB_ID=${id}\n`);
          console.log(`Cloudflare token active; D1 reused=${dbName}; created=false`);
          NODE
      - name: Patch local config only
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='radar/phase0/wrangler.jsonc';
          let text=fs.readFileSync(p,'utf8').replace('REEMPLAZAR_DESPUES_DE_CREAR_D1',process.env.DB_ID);
          fs.writeFileSync(p,text);
          const match=text.match(/"compatibility_date"\s*:\s*"([^"]+)"/);
          if(!match) throw new Error('Could not read compatibility_date');
          fs.appendFileSync(process.env.GITHUB_ENV,`COMPAT_DATE=${match[1]}\n`);
          NODE
      - name: Dry-run before remote writes
        working-directory: radar/phase0
        shell: bash
        run: |
          rm -rf ../../dist-dashboard
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID pnpm exec wrangler deploy --dry-run --outdir ../../dist-dashboard
          mapfile -t bundles < <(find ../../dist-dashboard -type f \( -name '*.js' -o -name '*.mjs' \))
          test "${#bundles[@]}" -eq 1 || { echo "Expected exactly one JS bundle, found ${#bundles[@]}"; exit 1; }
          ABS_BUNDLE="$(realpath "${bundles[0]}")"
          test -f "$ABS_BUNDLE" || { echo 'Bundle not found'; exit 1; }
          echo "BUNDLE_PATH=$ABS_BUNDLE" >> "$GITHUB_ENV"
          echo 'Dry-run succeeded before remote writes.'
      - name: Upload existing Worker only
        shell: bash
        run: |
          node - <<'NODE'
          const fs=await import('node:fs');
          const path=await import('node:path');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const worker=process.env.WORKER_NAME;
          const dbId=process.env.DB_ID;
          const file=process.env.BUNDLE_PATH;
          const moduleName=path.basename(file);
          const metadata={main_module:moduleName,compatibility_date:process.env.COMPAT_DATE,bindings:[{type:'d1',name:'DB',database_id:dbId}]};
          const form=new FormData();
          form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}),'metadata.json');
          form.append(moduleName,new Blob([fs.readFileSync(file)],{type:'application/javascript+module'}),moduleName);
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`},body:form});
          const text=await r.text();
          let data;try{data=JSON.parse(text)}catch{data={success:false,errors:[{message:'non-JSON response'}]}};
          if(!r.ok || !data.success) throw new Error(`Worker upload failed HTTP ${r.status}: ${JSON.stringify(data.errors||[]).slice(0,700)}`);
          console.log(`Existing Worker updated: ${worker}; no Worker or D1 created.`);
          NODE
      - name: Restore Mercado Publico ticket if present
        if: env.MERCADOPUBLICO_TICKET != ''
        shell: bash
        run: |
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CF_TOKEN;
          const worker=process.env.WORKER_NAME;
          const body={name:'MERCADOPUBLICO_TICKET',text:process.env.MERCADOPUBLICO_TICKET,type:'secret_text'};
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
          const data=await r.json();
          if(!r.ok || !data.success) throw new Error(`Secret restore failed HTTP ${r.status}`);
          console.log('Mercado Publico ticket restored server-side; value not printed.');
          NODE
      - name: Verify production dashboard cache-busted
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.WORKER_URL;
          const nonce=Date.now();
          async function fetchText(path){
            let last;
            for(let i=0;i<5;i++){
              const r=await fetch(`${base}${path}${path.includes('?')?'&':'?'}verify=${nonce}`,{headers:{'cache-control':'no-cache'}});
              const text=await r.text();last={r,text};
              if(r.ok) return last;
              if(i<4) await new Promise(resolve=>setTimeout(resolve,3000));
            }
            throw new Error(`${path} HTTP ${last.r.status}: ${last.text.slice(0,400)}`);
          }
          const health=await fetchText('/health');
          if(!JSON.parse(health.text).ok) throw new Error('/health payload not ok');
          const dash=await fetchText('/dashboard');
          if(!String(dash.r.headers.get('content-type')).startsWith('text/html')) throw new Error('dashboard is not HTML');
          if(!dash.text.includes('Radar de Compras Ágiles') || !dash.text.includes('Ranking histórico')) throw new Error('dashboard content missing');
          const live=await fetchText('/api/opportunities/live');
          const body=JSON.parse(live.text);
          if(!['api_v2','public_search_fallback'].includes(body.mode)) throw new Error(`unexpected mode ${body.mode}`);
          console.log(`/health=OK; /dashboard=OK; live_mode=${body.mode}; api_status=${body.api_status||'ok'}`);
          NODE
      - name: Summary
        run: echo 'Radar dashboard deployed on existing Worker; exact D1 reused; no D1 writes; free-only.'
