name: Ops Probe Public Compra Agil

on:
  push:
    branches: [ops/deploy-radar-dashboard]
    paths: ['.github/workflows/ops-probe-public-search.yml']

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'ops: probe official public Compra Agil search'
    runs-on: ubuntu-latest
    steps:
      - name: Probe public search HTML only
        shell: bash
        run: |
          node - <<'NODE'
          const base='https://buscador.mercadopublico.cl';
          const paths=[
            '/compra-agil?keywords=tornillo&order_by=recent&region=all',
            '/robots.txt'
          ];
          for (const path of paths) {
            const r=await fetch(base+path,{redirect:'follow',headers:{'user-agent':'HerramientasRentablesRadar/1.0 (+public-read-only-probe)','accept':'text/html,text/plain;q=0.9,*/*;q=0.5'}});
            const text=await r.text();
            console.log(JSON.stringify({
              path,
              status:r.status,
              contentType:r.headers.get('content-type'),
              bytes:text.length,
              hasCot:/\b\d+-\d+-COT\d{2}\b/i.test(text),
              cotMatches:(text.match(/\b\d+-\d+-COT\d{2}\b/gi)||[]).slice(0,5),
              hasNextData:text.includes('__NEXT_DATA__'),
              hasReactRoot:text.includes('root') || text.includes('__next'),
              scriptSrc:[...text.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]).slice(0,20),
              publicApiHints:[...new Set((text.match(/https?:\/\/[^"'<> ]+/g)||[]).filter(u=>/mercadopublico|chilecompra/i.test(u)).map(u=>u.replace(/[?#].*$/,'')))].slice(0,20)
            },null,2));
          }
          NODE
