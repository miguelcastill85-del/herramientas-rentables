name: Ops Verify Maintenance Baskets

on:
  push:
    branches: [ops/deploy-maintenance-baskets]
    paths: ['.github/workflows/ops-deploy-maintenance-baskets.yml']

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.head_commit.message == 'ops: verify maintenance basket Radar cache-busted'
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://radar-rentable-estado.miguelcastill85.workers.dev
    steps:
      - name: Read-only verification guard
        run: |
          echo 'Read-only public verification only.'
          echo 'No secrets, deployments, D1 writes, resource creation, billing changes, or paid services.'
      - name: Verify cache-busted production endpoint
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.WORKER_URL;
          const nonce=Date.now();
          const health=await fetch(`${base}/health?verify=${nonce}`,{headers:{Accept:'application/json','cache-control':'no-cache'}});
          const healthText=await health.text();
          if(!health.ok) throw new Error(`/health HTTP ${health.status}: ${healthText.slice(0,300)}`);
          const h=JSON.parse(healthText);
          if(!h.ok) throw new Error('/health payload is not ok');
          console.log('/health cache-busted: OK');

          const live=await fetch(`${base}/api/opportunities/live?verify=${nonce}`,{headers:{Accept:'application/json','cache-control':'no-cache'}});
          const text=await live.text();
          if(!live.ok) throw new Error(`/api/opportunities/live HTTP ${live.status}: ${text.slice(0,500)}`);
          const body=JSON.parse(text);
          if(!['api_v2','public_search_fallback'].includes(body.mode)) throw new Error(`Unexpected live mode: ${body.mode}`);
          if(body.focus!=='canastas_ferreteria_mantenimiento') throw new Error(`Unexpected focus: ${body.focus}`);
          if(body.target_budget_clp?.min!==300000 || body.target_budget_clp?.max!==3000000) throw new Error('Target budget metadata is wrong');
          console.log(`live mode=${body.mode}; api_status=${body.api_status||'ok'}; total=${body.total ?? 'unknown'}; focus=${body.focus}`);
          if(body.mode==='public_search_fallback'){
            if(!Array.isArray(body.searches) || body.searches.length!==6) throw new Error(`Expected six official fallback searches; got ${body.searches?.length}`);
            for(const entry of body.searches){
              const u=new URL(entry.url);
              if(u.hostname!=='buscador.mercadopublico.cl' || u.pathname!=='/compra-agil') throw new Error('Fallback contains non-official search URL');
              console.log(`fallback keyword=${entry.keyword}; official_host=${u.hostname}`);
            }
          } else {
            if(!Array.isArray(body.items)) throw new Error('API mode has no items array');
            for(const item of body.items.slice(0,8)) console.log('LIVE '+JSON.stringify({codigo:item.codigo,nombre:item.nombre,monto:item.monto_disponible_clp,ticket_band:item.ticket_band,score:item.score,fecha_cierre:item.fecha_cierre}));
          }
          NODE
