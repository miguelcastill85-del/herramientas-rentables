name: Analyze Radar Lower-Regulation Lab Demand

on:
  workflow_dispatch:
  push:
    branches: [analysis/radar-vertical-decision]
    paths:
      - '.github/workflows/analyze-radar-lab-safe-products.yml'

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'analysis: shortlist lower-regulation lab demand read only'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Resolve exact D1 read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_API_TOKEN" == cfat_* ]]
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=radar-rentable-estado&per_page=10" >/tmp/d1.json
          DB_ID="$(node -e 'const x=require("/tmp/d1.json");const m=(x.result||[]).filter(v=>v.name==="radar-rentable-estado");if(!x.success||m.length!==1)process.exit(1);process.stdout.write(m[0].uuid)')"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Read Laboratorio demand only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          sql="""SELECT title, budget_clp, competitor_count, selected_amount_clp, buyer_id, buyer_name, region
          FROM compra_agil_raw
          WHERE category='LABORATORIO';"""
          if any(x in sql.upper() for x in ['INSERT ','UPDATE ','DELETE ','CREATE ','DROP ','ALTER ','REPLACE ','PRAGMA ']):
              raise SystemExit('Blocked: write SQL detected')
          open('/tmp/query.json','w',encoding='utf-8').write(json.dumps({'sql':sql}, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/query" >/tmp/lab.json
          node -e 'const x=require("/tmp/lab.json");if(!x.success)process.exit(1);const m=x.result?.[0]?.meta||{};console.log(`D1 rows_read=${m.rows_read??"n/a"}; rows_written=${m.rows_written??0}`);if((m.rows_written||0)!==0)process.exit(1)'

      - name: Build conservative product shortlist
        shell: bash
        run: |
          python - <<'PY'
          import json, re, statistics, unicodedata
          from collections import Counter, defaultdict

          x=json.load(open('/tmp/lab.json', encoding='utf-8'))
          rows=(x.get('result') or [{}])[0].get('results') or []

          def norm(s):
              s=''.join(c for c in unicodedata.normalize('NFD', s or '') if unicodedata.category(c)!='Mn').lower()
              return ' '.join(re.findall(r'[a-z0-9]+', s))

          # Conservative filter: remove demand whose title signals medical/IVD/sterile or
          # higher-regulation intended use. This is a commercial screening heuristic, not
          # a legal classification of any individual SKU.
          exclude=[
              'reactiv','diagnost','pcr','test ',' test','examen','muestra','sangre','serolog','inmuno',
              'hematolog','bioquim','coagul','antigen','anticuerpo','microbiolog','bacteriolog',
              'cultivo','elisa','cobas','hba1c','virus','sars','cov2','glucosa','esteril','hipoderm',
              'jering','aguja','cateter','paciente','clinico','clinica','patolog','medical','medico',
              'transfusion','donacion','hemodial','formalina','fucsina','agar ',' agar','gaspack','sensidisco',
              'calibracion','calibrador','equipo ',' equipo','centrifug','microscop','analizador','autoclave',
              'incubador','espectro','refrigerador','freezer','congelador','horno laboratorio'
          ]

          candidates=[]
          excluded=[]
          for r in rows:
              t=norm(r.get('title'))
              if any(k in t for k in exclude): excluded.append(r)
              else: candidates.append(r)

          print(f'LAB total={len(rows)}')
          print(f'Conservative lower-regulation candidate pool={len(candidates)} ({len(candidates)/len(rows):.2%})')
          print(f'Excluded higher/uncertain-regulation signals={len(excluded)} ({len(excluded)/len(rows):.2%})')

          themes={
              'VIDRIERIA_RECIPIENTES':['vidrio','vidrieria','frasco','frascos','botella','botellas','matraz','matraces','probeta','probetas','vaso precipitado','vasos precipitados','recipiente','recipientes'],
              'FILTRACION':['papel filtro','filtro','filtros','membrana','membranas'],
              'PIPETEO_GENERAL':['pipeta','pipetas','micropipeta','micropipetas','punta pipeta','puntas pipeta'],
              'SOPORTES_ORGANIZACION':['gradilla','gradillas','rack','racks','soporte','soportes'],
              'PLASTICOS_GENERALES':['tubo','tubos','placa','placas','cubeta','cubetas','caja','cajas'],
              'MATERIALES_GENERALES':['materiales generales laboratorio','material general laboratorio','insumos generales laboratorio','insumo general laboratorio'],
              'AGUA_SOLUCIONES_NO_DIAG':['agua destilada','agua desionizada','agua purificada'],
          }

          tagged=[]
          for r in candidates:
              t=norm(r.get('title'))
              matches=[name for name, keys in themes.items() if any(k in t for k in keys)]
              if not matches:
                  matches=['OTRO_GENERAL']
              for theme in matches:
                  tagged.append((theme,r))

          grouped=defaultdict(list)
          for theme,r in tagged: grouped[theme].append(r)

          print('\nTHEME METRICS')
          for theme, items in sorted(grouped.items(), key=lambda kv:len(kv[1]), reverse=True):
              budgets=[float(i['budget_clp']) for i in items if i.get('budget_clp')]
              comps=[float(i['competitor_count']) for i in items if i.get('competitor_count') is not None]
              low=sum(1 for c in comps if 1 <= c <= 3)/len(comps) if comps else 0
              buyers=Counter((i.get('buyer_id') or i.get('buyer_name')) for i in items if (i.get('buyer_id') or i.get('buyer_name')))
              repeats=sum(1 for n in buyers.values() if n>=2)
              print(
                  f'{theme}: processes={len(items)}, median_budget={statistics.median(budgets) if budgets else 0:.0f}, '
                  f'median_competitors={statistics.median(comps) if comps else 0:.1f}, low_comp={low:.2%}, '
                  f'unique_buyers={len(buyers)}, repeat_buyers={repeats}'
              )

          print('\nCANDIDATE TITLES WITH <=3 COMPETITORS')
          shown=0
          for r in sorted(candidates, key=lambda i:(float(i.get('competitor_count') or 999), -(float(i.get('budget_clp') or 0)))):
              c=float(r.get('competitor_count') or 0)
              if 1 <= c <= 3 and r.get('title'):
                  print(f"c={int(c)} budget={r.get('budget_clp')} buyer={r.get('buyer_name') or r.get('buyer_id')} | {r['title']}")
                  shown+=1
                  if shown>=40: break

          # Product-word document frequency inside conservative pool.
          stop={'laboratorio','laboratorios','adquisicion','adquisici','compra','cotizacion','para','del','de','la','el','los','las','y','en','por','con','un','una','se','que','su','sus','al','2026','2025','julio','agosto','insumo','insumos','material','materiales','general','generales','servicio','servicios','unidad'}
          words=Counter()
          for r in candidates:
              toks={t for t in norm(r.get('title')).split() if len(t)>=3 and t not in stop and not t.isdigit()}
              words.update(toks)
          print('\nLOWER-REGULATION POOL TOP WORDS')
          for k,v in words.most_common(40): print(f'{v:4d} {k}')
          PY

      - name: Confirm zero writes
        run: echo 'Conservative laboratory product shortlist completed read-only; 0 D1 writes.'
